name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pinned package manager
        run: corepack enable

      - name: Install locked development dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the full quality gate
        run: pnpm run gate
